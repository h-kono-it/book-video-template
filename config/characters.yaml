# キャスト定義。config/brief.yaml の cast から npm run apply-brief で更新される
# speakerId: VOICEVOX のスタイル ID / image: public/images/<image>/（null なら立ち絵なし）
# voice: speed（倍率）, pitch, intonation, volume

zundamon:
  name: ずんだもん
  speakerId: 3
  position: right
  color: "#228B22"
  image: zundamon
  flipX: false
  voice: {}
  defaultPauseAfter: 15

metan:
  name: 四国めたん
  speakerId: 2
  position: left
  color: "#FF1493"
  image: metan
  flipX: true
  voice: {}
  defaultPauseAfter: 15
